<form [formGroup]="descriptionForm">
    <app-select-input
        [parentForm]="descriptionForm"
        inputName="lang"
        label="Language"
        [options]="descriptionLangs"
        placeholder="Select a language"></app-select-input>
    <div>
        <label for="desc">Description</label>
        <textarea id="desc" formControlName="description" pInputTextarea></textarea>
    </div>
</form>

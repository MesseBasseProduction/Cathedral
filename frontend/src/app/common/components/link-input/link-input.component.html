<form [formGroup]="linkForm">
    <app-select-input
        [parentForm]="linkForm"
        inputName="type"
        label="Type"
        [options]="options"
        optionLabel="label"
        optionValue="code"
        placeholder="Select a link type"></app-select-input>
    <app-text-input inputName="url" type="url" [parentForm]="linkForm" label="URL"></app-text-input>
</form>

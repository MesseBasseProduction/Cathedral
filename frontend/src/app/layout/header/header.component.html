<div class="header">
    <app-breadcrumbs />

    <div class="grow"></div>

    <p-button
        (click)="onVariantToggle()"
        icon="pi pi-moon"
        size="small"
        severity="secondary"
        outlined />

    <p-button (click)="menu.toggle($event)" icon="pi pi-bars" size="small" outlined />
    <p-menu #menu [popup]="true" [model]="menuItems" />
</div>
